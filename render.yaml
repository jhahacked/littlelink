services:
  - type: web
    name: littlelink-api
    runtime: node
    buildCommand: npm ci --prefix frontend && npm ci --prefix backend --omit=dev && npm run build --prefix frontend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
